<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Attendance"><meta name="theme-color" content="#6366f1">
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#1a1d29;--mu:#7b8194;--bd:#eceef4;--ac:#6366f1;--ok:#059669;--bad:#e11d48;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--tx:#eceef5;--mu:#8e95a8;--bd:#272b38;--ac:#8b8cff;--ok:#34d399;--bad:#fb7185;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--tx:#eceef5;--mu:#8e95a8;--bd:#272b38;--ac:#8b8cff;--ok:#34d399;--bad:#fb7185;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
.w{max-width:520px;margin:0 auto;padding:12px 12px 76px}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;border-radius:11px;flex:none}.brand h1{font-size:19px;margin:0;line-height:1.1;letter-spacing:.2px}.brand small{display:block;font-size:10px;color:var(--mu);margin-top:2px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:none;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac)}
.ys{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.y{flex:none;border-radius:99px;padding:4px 12px;font-size:13px}
.on{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:10px}
.sub{border-left:4px solid var(--c)}
.hero{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border-radius:18px;padding:14px;margin-top:4px}
.hero input{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.hero .bar{background:rgba(255,255,255,.3)}
.hero .pct{color:#fff!important}
.hero .msg{background:rgba(255,255,255,.18)!important;color:#fff!important}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
input,select{font:inherit;font-size:13px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;min-width:0}
.nm{font-weight:600;flex:1;background:transparent;border-color:transparent;padding:3px 4px}
.nm:focus{background:var(--bg);border-color:var(--bd)}
button{font:inherit;font-size:13px;cursor:pointer;border-radius:9px;border:1px solid var(--bd);padding:6px 10px;background:var(--card);color:var(--tx)}
.pct{font-size:18px;font-weight:700;white-space:nowrap}
.bar{height:5px;background:var(--bd);border-radius:6px;margin:6px 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px}
.tk{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.35}
.msg{font-size:12px;padding:5px 9px;border-radius:8px;margin-top:6px;background:var(--bg)}
.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.bad{background:color-mix(in srgb,var(--bad) 13%,var(--card));color:var(--bad)}
.btns{display:flex;gap:6px;margin-top:8px}
.p,.a{flex:1;border-color:transparent;font-weight:600}
.p{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok)}
.a{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.ps{background:var(--ok)!important;color:#fff!important}.as{background:var(--bad)!important;color:#fff!important}
.mu{color:var(--mu);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,var(--card));color:var(--c);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.cat{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
.num{width:56px;text-align:center}
.add{width:100%;margin-top:10px;border-style:dashed;color:var(--ac);background:transparent}
.hd{cursor:pointer}
.del{color:var(--bad);font-size:12px;padding:3px 6px;background:none;border:none}
.ln{border-top:1px solid var(--bd);padding:8px 0}
.warn{background:#fef3c7;color:#92400e;border-radius:12px;padding:8px 10px;font-size:12px;margin-top:10px}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;border:none;background:none;font-size:11px;color:var(--mu);padding:4px 0;display:flex;flex-direction:column;align-items:center}
.nav button span{font-size:17px}
.nav .act{color:var(--ac);font-weight:700}
textarea{width:100%;height:70px;font:11px monospace;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;margin-top:8px}
</style>
</head>

        m+='<div class="cat"><div class="row"><span class="dot" style="background:'+cl+'"></span><input class="nm" data-f="cn" '+at+' value="'+esc(x.name)+'"><span class="pct" style="color:'+stc(q.v)+'">'+bn(q.v.toFixed(1))+'%</span></div>'+barx(q.v,cl)+
        '<div class="row mu"><span>উপস্থিত <input class="num" type="number" min="0" data-f="a" '+at+' value="'+x.a+'"></span><span>মোট <input class="num" type="number" min="0" data-f="t" '+at+' value="'+x.t+'"></span></div>'+
        (ST[x.id]?'<div class="mu" style="margin-top:3px">ক্যালেন্ডার থেকে যোগ: '+bn(ST[x.id].a)+' / '+bn(ST[x.id].t)+' → সর্বমোট '+bn(e.a)+' / '+bn(e.t)+'</div>':'')+
        '<div class="btns"><button class="p" data-act="p" '+at+'>＋ উপস্থিত</button><button class="a" data-act="ab" '+at+'>＋ অনুপস্থিত</button><button data-act="u" '+at+'>↩︎</button></div><div class="msg '+q.cls+'">'+q.txt+'</div>'+dbtn("c"+x.id,"🗑 মুছুন")+'</div>'});

function rView(Y){

    m+=(Y.subs.length?'<button class="add" style="margin-top:6px" data-act="addrt" data-d="'+dy+'">＋ ক্লাস যোগ</button>':'<div class="mu">আগে "হিসাব" ট্যাবে সাবজেক্ট যোগ করুন।</div>')+'</div>'});
  m+='<div class="card"><b>ছুটির দিন</b><div class="row" style="margin-top:6px"><input type="date" id="hd" style="flex:1"><button data-act="addoff">যোগ</button></div>';
  Y.off.slice().sort().forEach(function(x){m+='<div class="row ln"><span>'+bn(x)+'</span><button class="del" data-act="deloff" data-ds="'+x+'">✕</button></div>'});
  return m+'</div>'}
function sView(){
  var m='<div class="card"><b>🌐 ভাষা</b><div class="seg"><button class="'+(R.lang==="bn"?"on":"")+'" data-act="lang" data-l="bn">বাংলা</button><button class="'+(R.lang==="en"?"on":"")+'" data-act="lang" data-l="en">English</button></div></div>';

    m+='<div class="row ln"><input class="nm" data-f="pn" data-p="'+p.id+'" value="'+esc(p.name)+'"><button class="'+(on?"on":"")+'" data-act="usep" data-p="'+p.id+'">'+(on?"✓ চলমান":"ব্যবহার")+'</button>'+(R.profiles.length>1?dbtn("p"+p.id,"🗑"):"")+'</div>'});
  m+='<input id="np" placeholder="নতুন প্রোফাইলের নাম" style="width:100%;margin-top:8px"><div class="btns"><button class="p" data-act="addp" data-pre="1">＋ প্রিসেট সহ (১ম–৫ম বর্ষ)</button><button data-act="addp" data-pre="0">＋ ফাঁকা</button></div><div class="mu" style="margin-top:8px">প্রতিটি প্রোফাইলের ডাটা আলাদা, এই ডিভাইসে সেভ থাকে।</div></div>';
  m+='<div class="card"><b>💾 ব্যাকআপ ও ট্রান্সফার</b><div class="mu">এক ডিভাইসের রুটিন ও হিসাব অন্য ডিভাইসে নেওয়ার জন্য।</div><div class="btns"><button data-act="exp">⬆ এক্সপোর্ট (কপি)</button><button data-act="imp">⬇ ইমপোর্ট</button></div>'+(bk?'<textarea id="bk" readonly onclick="this.select()"></textarea>':'')+'<textarea id="ib" placeholder="এখানে পেস্ট করুন"></textarea><div class="mu" style="margin-top:6px">'+bkm+'</div></div>';
  return m}
function render(){
  var Y=S.years[S.cy],h="";stats(Y);
  function put(i,x){document.getElementById(i).innerHTML=tr(x)}
  put("top",'<div class="brand"><img src="'+IC+'" alt=""><div><h1>Attendance</h1><small>Created and developed by : Shahriar Shafi</small></div></div><button class="chip" data-act="view" data-v="s">👤 '+esc(S.name)+'</button>');

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,Y=S.years[S.cy];
  if(a!=="del")armed=null;
  if(a==="year")S.cy=+b.dataset.i;
  else if(a==="view")view=b.dataset.v;
  else if(a==="lang")R.lang=b.dataset.l;
  else if(a==="exp"){bk=JSON.stringify(R);bkm="নিচের লেখাটি কপি করুন (ট্যাপ করলে সিলেক্ট হবে), তারপর অন্য ডিভাইসে ইমপোর্টে পেস্ট করুন।";try{navigator.clipboard.writeText(bk).catch(function(){})}catch(x){}}
  else if(a==="imp"){var tv=(document.getElementById("ib")||{}).value||"";try{var dd=JSON.parse(tv);if(!dd||!dd.profiles||!dd.profiles.length)throw 0;dd.profiles.forEach(function(p){p.id=id();p.name=(p.name||"Profile")+" (import)";R.profiles.push(p)});R.pid=R.profiles[R.profiles.length-1].id;act();bkm="✅ ইমপোর্ট হয়েছে (নতুন প্রোফাইল হিসেবে)।"}catch(x){bkm="❌ ডাটা ঠিক নেই।"}}
  else if(a==="usep"){R.pid=b.dataset.p;act();open=null;sel=TD}
  else if(a==="addp"){var nv=document.getElementById("np").value.trim()||"প্রোফাইল "+bn(R.profiles.length+1),np=newP(id(),nv,b.dataset.pre==="1");R.profiles.push(np);R.pid=np.id;act();open=null;view="h"}
  else if(a==="addyear"){var y=new Date().getFullYear();S.years.push({id:id(),name:bn(S.years.length+1)+"ম বছর",subs:[],start:y+"-01-01",end:y+"-12-31",rt:[],off:[],rec:{}});S.cy=S.years.length-1}
  else if(a==="addsub"){var n=sub("নতুন সাবজেক্ট");Y.subs.push(n);open=n.id}
  else if(a==="tog")open=open===b.dataset.s?null:b.dataset.s;
  else if(a==="addcat")find(b.dataset.s)[0].cats.push({id:id(),name:"নতুন ধরন",a:0,t:0});
  else if(a==="del"){var k=b.dataset.k;if(armed!==k){armed=k;render();return}armed=null;
    if(k[0]==="y"){if(S.years.length>1){S.years.splice(S.cy,1);S.cy=0}}
    else if(k[0]==="p"){var pid=k.slice(1);R.profiles=R.profiles.filter(function(p){return p.id!==pid});if(R.pid===pid)R.pid=R.profiles[0].id;act()}
    else if(k[0]==="s"){var sid=k.slice(1);Y.subs=Y.subs.filter(function(z){return z.id!==sid});Y.rt=Y.rt.filter(function(r){return r.sid!==sid})}
    else{var cid=k.slice(1);Y.subs.forEach(function(z){z.cats=z.cats.filter(function(c){return c.id!==cid})});Y.rt=Y.rt.filter(function(r){return r.cid!==cid})}}
  else if(a==="addrt"){var s=Y.subs[0];Y.rt.push({id:id(),day:+b.dataset.d,sid:s.id,cid:s.cats[0]?s.cats[0].id:"",time:""})}
  else if(a==="delrt")Y.rt=Y.rt.filter(function(r){return r.id!==b.dataset.e});
  else if(a==="day")sel=fmt(addDays(parse(sel),+b.dataset.n));
  else if(a==="today")sel=TD;
  else if(a==="gounm"&&UF)sel=UF;
  else if(a==="off"){var i=Y.off.indexOf(sel);if(i>=0)Y.off.splice(i,1);else Y.off.push(sel)}
  else if(a==="addoff"){var v=document.getElementById("hd").value;if(v&&Y.off.indexOf(v)<0)Y.off.push(v)}
  else if(a==="deloff")Y.off=Y.off.filter(function(x){return x!==b.dataset.ds});
  else if(a==="mk"){var key=(b.dataset.ds||sel)+"|"+b.dataset.e;if(b.dataset.m)Y.rec[key]=b.dataset.m;else delete Y.rec[key]}
  else{var x=find(b.dataset.s,b.dataset.c)[1];if(!x)return;
    hist[x.id]=hist[x.id]||[];
    if(a==="u"){var l=hist[x.id].pop();if(l){x.t=Math.max(0,x.t-1);if(l==="p")x.a=Math.max(0,x.a-1)}}
    else{x.t++;if(a==="p")x.a++;hist[x.id].push(a==="p"?"p":"b")}}
  save();render()});
document.addEventListener("change",function(e){
  var el=e.target,f=el.dataset.f,Y=S.years[S.cy];

  else if(f==="ys"||f==="ye"){if(el.value)Y[f==="ys"?"start":"end"]=el.value}
  else if(f==="sn")find(el.dataset.s)[0].name=el.value||"সাবজেক্ট";

    if(f==="cn")x.name=el.value||"ধরন";
    else{x[f]=Math.max(0,Math.floor(+el.value||0));if(x.a>x.t){if(f==="a")x.t=x.a;else x.a=x.t}}}
  else return;
  save();render()});
function tn(t){t=(t||"").toLowerCase();return t.indexOf("lec")>=0?"লেকচার":t.indexOf("tut")>=0?"টিউটোরিয়াল":t.indexOf("ward")>=0?"ওয়ার্ড":(t||"অন্যান্য")}
async function imp(file){
  var Y=S.years[S.cy];imps="⏳ রুটিন পড়া হচ্ছে...";render();
  try{
    var r=await SM.json('This image is the weekly class routine of a medical student. Extract every recurring class. Reply with only a JSON array: [{"day":0-6 (0=Sunday),"subject":"name","type":"Lecture|Tutorial|Ward|other","time":"HH:MM-HH:MM or empty"}]',{images:[file]});
    if(!Array.isArray(r))throw 0;
    var out=[];
    r.forEach(function(z){var nm=String(z.subject||"").trim(),dy=+z.day;if(!nm||!(dy>=0&&dy<=6))return;
      var s=Y.subs.filter(function(q){return q.name.toLowerCase()===nm.toLowerCase()})[0];
      if(!s){s=sub(nm);Y.subs.push(s)}
      var cn=tn(z.type),c=s.cats.filter(function(q){return q.name===cn})[0];
      if(!c){c={id:id(),name:cn,a:0,t:0};s.cats.push(c)}
      out.push({id:id(),day:dy,sid:s.id,cid:c.id,time:String(z.time||"")})});
    Y.rt=out;imps="✅ "+bn(out.length)+"টি ক্লাস যোগ হয়েছে। নিচে মিলিয়ে দেখুন, ভুল থাকলে ঠিক করুন।"
  }catch(e){imps="❌ পড়া যায়নি। পরিষ্কার ছবি দিন, অথবা নিচে হাতে যোগ করুন।"}
  save();render()}
document.addEventListener("visibilitychange",function(){var n=fmt(new Date());if(n!==TD){TD=n;sel=n;render()}});
render();
(async function(){try{if(window.claude&&claude.use){var s=await claude.use("sample");if(s){var L=await s.limits();if(L&&L.images){SM=s;render()}}}}catch(e){}})();
